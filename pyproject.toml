[project]
name = "goodshowroom-ai-layer"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pymongo==4.19.0",
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.14.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodshowroom_ai"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers --strict-config -p no:cacheprovider -m "not integration and not live"'
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: requires explicit opt-in and a verified isolated database target",
    "live: requires explicit opt-in and a separately reviewed live adapter",
]
